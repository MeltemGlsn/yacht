    <!--This is the navigation section-->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="tours.html">Tours</a></li>

        </ul>

    <!--This is the Gallery section-->
    <main id="main-gallery-container">
        <h1>The Elegant Yachting Gallery</h1>
        <div id="gallery">
            <figure>
                <img src="assets/images/sailing-yacht.jpg" alt="A sailing yacht with grey sails on the open sea" loading="lazy">
                <figcaption>Sailing on the open sea</figcaption>
            </figure>

            <figure>
                <img src="assets/images/sunset-cruise.jpg" alt="A yacht on calm water under a pink sunset sky" loading="lazy">
                <figcaption>Sunset cruise</figcaption>
            </figure>

            <figure>
                <img src="assets/images/superyacht-islands.jpg" alt="A white superyacht near small green islands" loading="lazy">
                <figcaption>Island hopping</figcaption>
            </figure>

            <figure>
                <img src="assets/images/lounge-deck.jpg" alt="A yacht lounge deck with a dining table and sea view" loading="lazy">
                <figcaption>Lounge deck</figcaption>
            </figure>

            <figure>
                <img src="assets/images/night-cruise.jpg" alt="A large yacht lit up on the water at night" loading="lazy">
                <figcaption>Evening on the water</figcaption>
            </figure>

            <figure>
                <img src="assets/images/evening-deck.jpg" alt="An open deck with lanterns and sofas at dusk" loading="lazy">
                <figcaption>Dinner on deck</figcaption>
            </figure>
        </div>
    </main>
